name: Build mod jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Locate project
        id: loc
        run: echo "dir=$(dirname $(find . -name build.gradle -not -path './.git/*' | head -1))" >> $GITHUB_OUTPUT

      - name: Build
        run: gradle build --no-daemon
        working-directory: ${{ steps.loc.outputs.dir }}

      - uses: actions/upload-artifact@v4
        with:
          name: civcraft-jar
          path: ${{ steps.loc.outputs.dir }}/build/libs/*.jar
